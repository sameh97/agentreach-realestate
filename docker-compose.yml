# version: "3.9"

# ─────────────────────────────────────────────────────────────
# AgentReach — Docker Compose
#
# Services:
#   mongo     — MongoDB 7            (127.0.0.1:27017, profile "local-db")
#   backend   — FastAPI + LangGraph  (port 8000)
#   frontend  — Next.js 14           (port 3000)
#
# Database — local container vs. MongoDB Atlas:
#   Local (default):  .env has COMPOSE_PROFILES=local-db and no MONGO_URI
#   Atlas:            .env sets MONGO_URI=mongodb+srv://... and drops
#                     COMPOSE_PROFILES, so the mongo container never starts
#
# Shared volume:
#   leads_output — CSV/XLSX files written by backend,
#                  mounted read-only by frontend for direct serving
#
# Usage:
#   cp .env.example .env          # fill in API keys
#   docker compose up --build     # first run (builds images)
#   docker compose up             # subsequent runs (uses cache)
#   docker compose down -v        # stop + remove volumes
# ─────────────────────────────────────────────────────────────

services:

  # ── MongoDB (local) ────────────────────────────────────────
  # Only started when the "local-db" profile is active. Bound to
  # 127.0.0.1 so it is reachable from your machine (Compass,
  # `make dev-back`) but never from the internet.
  mongo:
    image: mongo:7
    container_name: agentreach-mongo
    restart: unless-stopped
    profiles: ["local-db"]
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - agentreach_net
    healthcheck:
      test:     ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout:  5s
      retries:  10
      start_period: 10s


  # ── Backend ────────────────────────────────────────────────
  backend:
    build:
      context:    ./backend
      dockerfile: Dockerfile
    image: agentreach-backend:latest
    container_name: agentreach-backend
    restart: unless-stopped

    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"

    environment:
      # LLM
      OPENAI_API_KEY:        ${OPENAI_API_KEY}
      LLM_MODEL:             ${LLM_MODEL}
      LLM_PROVIDER:          ${LLM_PROVIDER:-}

      OLLAMA_BASE_URL:       ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}

      RAPIDAPI_KEY:          ${RAPIDAPI_KEY}
      SEARCHAPI_KEY:         ${SEARCHAPI_KEY:-}

      # Database — defaults to the local mongo container; set
      # MONGO_URI in .env to point at MongoDB Atlas instead
      MONGO_URI:             ${MONGO_URI:-mongodb://mongo:27017}
      MONGO_DB:              ${MONGO_DB:-agentreach}

      # Auth — must be set; tokens are signed with it
      JWT_SECRET:            ${JWT_SECRET:?JWT_SECRET is not set — add it to .env}
      JWT_TTL_DAYS:          ${JWT_TTL_DAYS:-7}

      # App config
      OUTPUT_DIR:            /app/output

    volumes:
      # Persist exported lead files between restarts
      - leads_output:/app/output

    depends_on:
      mongo:
        condition: service_healthy
        required:  false   # absent when using Atlas

    networks:
      - agentreach_net

    healthcheck:
      test:     ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout:  10s
      retries:  5
      start_period: 20s

    # Resource limits (tune for your server)
    deploy:
      resources:
        limits:
          memory: 1g
          cpus:   "1.0"


  # ── Frontend ───────────────────────────────────────────────
  frontend:
    build:
      context:    ./frontend
      dockerfile: Dockerfile
      args:
        # API URL seen by the BROWSER (public-facing)
        # In production set this to your domain, e.g. https://api.agentreach.io
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    image: agentreach-frontend:latest
    container_name: agentreach-frontend
    restart: unless-stopped

    ports:
      - "3000:3000"

    environment:
      # Internal URL for Next.js API rewrites (server-side)
      # Uses Docker internal DNS — "backend" resolves to the backend container
      BACKEND_URL: http://backend:8000
      NODE_ENV:    production

    depends_on:
      backend:
        condition: service_healthy

    networks:
      - agentreach_net

    healthcheck:
      test:     ["CMD", "wget", "-qO-", "http://127.0.0.1:3000"]
      interval: 30s
      timeout:  10s
      retries:  3
      start_period: 30s

    deploy:
      resources:
        limits:
          memory: 512m
          cpus:   "0.5"


# ── Shared network ─────────────────────────────────────────
networks:
  agentreach_net:
    driver: bridge


# ── Named volumes ──────────────────────────────────────────
volumes:
  leads_output:
    driver: local
  mongo_data:
    driver: local